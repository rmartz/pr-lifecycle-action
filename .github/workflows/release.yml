name: Release

# Automated releases via the fleet's shared semantic-release workflow
# (rmartz/semantic-release-ci). On every push to main it analyzes the
# Conventional-Commit history and, when a release is warranted, creates the git tag
# + GitHub Release. It publishes NOTHING to a package registry and commits NOTHING
# back to the repo (no @semantic-release/npm, no @semantic-release/git), so the
# built-in GITHUB_TOKEN suffices — no PAT. The release toolchain (semantic-release,
# its plugins and the changelog preset) lives in semantic-release-ci, where a
# toolchain bump is tested before it reaches this pin; the options stay here in
# .releaserc.json.
#
# The key cadence: a Dependabot `fix(deps): bump @rmartz/pr-lifecycle …` PR is
# auto-merged by bot-automerge, and the conventionalcommits preset maps `fix` →
# patch, so that CLI bump cuts a new action release. Consumers then pick it up via
# their own Dependabot github-actions ecosystem.

on:
  push:
    branches: [main]

# The shared workflow declares no permissions of its own; it runs with these.
# Releases are serialized per repository inside it. Nothing is installed from
# this repo's package.json, so no `packages: read` is needed.
permissions:
  contents: write # create tags + GitHub Releases
  issues: write # semantic-release/github housekeeping
  pull-requests: write

jobs:
  release:
    uses: rmartz/semantic-release-ci/.github/workflows/semantic-release.yml@4de919a5895b3add06be7faadf3bf04490d909a0 # v1.0.0

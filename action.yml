name: 'pr-lifecycle'
description: "Reconcile a PR's lifecycle labels and GitHub-native auto-merge via the pinned @rmartz/pr-lifecycle CLI."
author: 'rmartz'

branding:
  icon: 'git-pull-request'
  color: 'blue'

# A composite action that wraps `pr-lifecycle reconcile` from the
# @rmartz/pr-lifecycle CLI. The CLI owns every decision (lifecycle state, labels,
# bot eligibility, fork trust, whether to arm or merge); this action only installs
# the version pinned in its own package-lock.json, creates the real-actor token
# from a GitHub App when given one (falling back to labels only when it can't),
# works out which PR(s) the event is about, and invokes the CLI on each
# (scripts/token-source.sh, scripts/reconcile.sh). The contract is
# documented in docs/design/integration-contract.md; the caller snippet, required
# permissions, and triggers are in docs/consuming.md.
#
# NOTE: input descriptions must not contain a template expression: an action
# manifest validates expressions in input metadata against a context where github
# is unavailable, so one there fails the action load.

inputs:
  pr:
    description: >-
      Number of the PR to reconcile. Empty (the default) resolves it from the
      triggering event: the pull_request payload, a workflow_dispatch `pr`
      input, or the PRs of a check_suite / workflow_run (looked up by head SHA
      when GitHub omits them, as it does for fork PRs). See docs/consuming.md.
    required: false
    default: ''
  github-token:
    description: >-
      Token for every read and every label, review-request, and comment write:
      the CLI's GITHUB_TOKEN. Defaults to the workflow token, whose job needs
      pull-requests:write, contents:read, checks:read and statuses:read.
    required: false
    default: ${{ github.token }}
  token:
    description: >-
      Real-actor token used only to arm, merge, and update branches, so the
      merge re-triggers the consumer's on:push workflows, and to post the
      pr-lifecycle/sign-off commit status that pr-policy gates on. Exported as
      the CLI's PR_LIFECYCLE_TOKEN. Prefer app-client-id and app-private-key,
      which create one here; pass token only for a token made elsewhere (a
      person's PAT, say). Passing it with the App inputs fails the run. When no
      real-actor token is available, the CLI skips those writes (never falling
      back to github-token) and reports them in auto-merge-skipped,
      update-skipped, or sign-off-status-skipped; with no status, pr-policy
      holds every PR.
    required: false
    default: ''
  app-client-id:
    description: >-
      Client ID of the GitHub App the action creates its real-actor token from,
      conventionally the PR_LIFECYCLE_CLIENT_ID secret. With app-private-key, the
      action creates an installation token for this repository and uses it as
      token. If either is empty, or creating the token fails (the App isn't
      installed here, or the key is wrong), the run carries on without a
      real-actor token and says why. See docs/consuming.md.
    required: false
    default: ''
  app-private-key:
    description: >-
      Private key of that GitHub App, conventionally the
      PR_LIFECYCLE_PRIVATE_KEY secret. See app-client-id.
    required: false
    default: ''
  arm-auto-merge:
    description: 'Arm, merge, or disarm GitHub-native auto-merge from the lifecycle state (true | false).'
    required: false
    default: 'false'
  trusted-authors:
    description: >-
      Comma-separated logins to narrow trust to; they still need write access.
      Empty (the default) leaves the CLI's own policy in place — write-access
      collaborators only. There is deliberately no way to trust anyone.
    required: false
    default: ''
  auto-update:
    description: >-
      Bring an approved PR that merge-safety labels `update required` up to date
      with its base (true | false). Dependabot PRs are never updated: a person or
      Dependabot itself rebases them. Needs the token input.
    required: false
    default: 'false'
  skip-copilot-review:
    description: >-
      Deprecated: the CLI now waits only while a bot reviewer's request is
      pending, so this is rarely needed. Do not wait for requested bot
      reviewers (true | false).
    deprecationMessage: >-
      skip-copilot-review is deprecated: the CLI waits only while a bot
      reviewer's request is pending. Remove it from your workflow.
    required: false
    default: 'false'
  hold-checks:
    description: >-
      Comma-separated required checks whose pending state is a human hold rather
      than a running build. Empty (the default) keeps the CLI default.
    required: false
    default: ''
  ignore-checks:
    description: >-
      Comma-separated required checks the CI gate never counts. Empty (the
      default) keeps the CLI default.
    required: false
    default: ''
  uat:
    description: >-
      The repo's UAT setting (on | off). on keeps one UAT label on each PR,
      UAT pending until a person signs it off; off labels every PR no UAT
      needed. Also decides the pr-lifecycle/sign-off status. Read from the
      caller workflow on the base branch, so a PR can't turn UAT off for itself.
    required: false
    default: 'on'
  token-advisory:
    description: >-
      Post a one-time advisory comment on the PR when arming, merging, or the
      sign-off status is skipped for want of a real-actor token (true | false).
      The job log and the token-source output say which case it was.
    required: false
    default: 'true'
  dry-run:
    description: 'Gather facts and plan, but write nothing (true | false).'
    required: false
    default: 'false'
  node-version:
    description: 'Node.js version to run the CLI under.'
    required: false
    default: '22'

outputs:
  token-source:
    description: >-
      Where the real-actor token came from: token, app, app-failed (creating
      the App token failed), app-incomplete (only one App input was set), or
      none.
    value: ${{ steps.reconcile.outputs.token-source }}
  results:
    description: "JSON array of the CLI's --json result for every PR reconciled ([] when the event names no open PR)."
    value: ${{ steps.reconcile.outputs.results }}
  # The per-field outputs below describe a single PR: they are set only when
  # exactly one PR was reconciled, and are empty otherwise.
  result:
    description: "The CLI's full --json result object, compact."
    value: ${{ steps.reconcile.outputs.result }}
  schema-version:
    description: "The result's schemaVersion. Always 1: the action fails on any other value."
    value: ${{ steps.reconcile.outputs.schema-version }}
  state:
    description: "The PR's lifecycle state (e.g. approved, awaiting-ci, awaiting-bot-review). Treat unknown values as non-terminal."
    value: ${{ steps.reconcile.outputs.state }}
  add-labels:
    description: 'JSON array of labels added.'
    value: ${{ steps.reconcile.outputs.add-labels }}
  remove-labels:
    description: 'JSON array of labels removed.'
    value: ${{ steps.reconcile.outputs.remove-labels }}
  auto-merge:
    description: 'What was done to auto-merge: arm, merge, disarm, or none.'
    value: ${{ steps.reconcile.outputs.auto-merge }}
  auto-merge-skipped:
    description: 'JSON object { action, reason } when an arm or merge was skipped, else empty.'
    value: ${{ steps.reconcile.outputs.auto-merge-skipped }}
  bot-eligible:
    description: 'Whether the PR is an eligible bot PR (true | false).'
    value: ${{ steps.reconcile.outputs.bot-eligible }}
  bot-eligibility:
    description: 'JSON object { eligible, reason, prType, updateType }.'
    value: ${{ steps.reconcile.outputs.bot-eligibility }}
  carry-over:
    description: 'JSON object { cleanAncestors, stoppedBecause } for approval carry-over, or empty when it did not run.'
    value: ${{ steps.reconcile.outputs.carry-over }}
  update:
    description: 'The branch update performed: update-branch or none.'
    value: ${{ steps.reconcile.outputs.update }}
  update-skipped:
    description: 'JSON object { action, reason } when a branch update was skipped, else empty.'
    value: ${{ steps.reconcile.outputs.update-skipped }}
  uat:
    description: "JSON object { outcome, label } for the PR's one UAT label, or empty for a closed PR."
    value: ${{ steps.reconcile.outputs.uat }}
  sign-off:
    description: 'JSON object { requirement, reason, loosening, status, statusPosted } for the sign-off status, or empty for a closed PR.'
    value: ${{ steps.reconcile.outputs.sign-off }}
  sign-off-status-skipped:
    description: 'JSON object { reason } when the sign-off status was skipped, else empty.'
    value: ${{ steps.reconcile.outputs.sign-off-status-skipped }}

runs:
  using: composite
  steps:
    # Decide where the real-actor token comes from (scripts/token-source.sh).
    # Only whether each input is set reaches the script, never a secret. A
    # token passed alongside the App inputs fails here, before anything runs.
    - name: Resolve the real-actor token source
      id: token-source
      shell: bash
      env:
        HAS_TOKEN: ${{ inputs.token != '' }}
        HAS_APP_CLIENT_ID: ${{ inputs.app-client-id != '' }}
        HAS_APP_PRIVATE_KEY: ${{ inputs.app-private-key != '' }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/token-source.sh"
    # Create an installation token for this repository only, with the
    # permissions the CLI's real-actor writes need. continue-on-error keeps a
    # failure (the App isn't installed here, a bad key, a permission the App
    # wasn't granted) from failing the job: the reconcile step sees the outcome,
    # carries on without the token, and says why.
    - name: Create the App installation token
      id: app-token
      if: steps.token-source.outputs.source == 'app'
      continue-on-error: true
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        client-id: ${{ inputs.app-client-id }}
        private-key: ${{ inputs.app-private-key }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ github.event.repository.name }}
        permission-contents: write
        permission-pull-requests: write
        permission-issues: write
        permission-statuses: write
        permission-workflows: write
        permission-checks: read
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
    # Install the pinned CLI into this action's own directory — $GITHUB_ACTION_PATH
    # holds this action's package.json, lockfile, and .npmrc (which pins the
    # @rmartz scope to npmjs) — not the consumer workspace. The package is public
    # on npmjs, so the install needs no token. Dev dependencies (the release
    # toolchain) are not needed to run the CLI, and it has no install scripts.
    - name: Install pinned @rmartz/pr-lifecycle
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
    - name: Reconcile
      id: reconcile
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GH_TOKEN: ${{ inputs.github-token }}
        PR_LIFECYCLE_TOKEN: ${{ inputs.token || steps.app-token.outputs.token }}
        TOKEN_SOURCE: ${{ steps.token-source.outputs.source }}
        APP_TOKEN_OUTCOME: ${{ steps.app-token.outcome }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ inputs.pr }}
        ARM_AUTO_MERGE: ${{ inputs.arm-auto-merge }}
        TRUSTED_AUTHORS: ${{ inputs.trusted-authors }}
        AUTO_UPDATE: ${{ inputs.auto-update }}
        SKIP_COPILOT_REVIEW: ${{ inputs.skip-copilot-review }}
        HOLD_CHECKS: ${{ inputs.hold-checks }}
        IGNORE_CHECKS: ${{ inputs.ignore-checks }}
        UAT: ${{ inputs.uat }}
        TOKEN_ADVISORY: ${{ inputs.token-advisory }}
        DRY_RUN: ${{ inputs.dry-run }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/reconcile.sh"
